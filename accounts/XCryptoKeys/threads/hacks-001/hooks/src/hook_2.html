<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>body{margin:0;background:#040823}.t{font-family:'Exo 2',Inter,sans-serif}.m{font-family:'JetBrains Mono',monospace}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Inter,sans-serif">
<defs>
 <radialGradient id="bg" cx="55%" cy="45%" r="80%"><stop offset="0" stop-color="#10235b"/><stop offset=".55" stop-color="#081039"/><stop offset="1" stop-color="#040823"/></radialGradient>
 <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#5cfcfa"/><stop offset="1" stop-color="#ad59e9"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#172667" stop-opacity=".85"/><stop offset="1" stop-color="#0b2053" stop-opacity=".7"/></linearGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="60"/></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2169af" stroke-opacity=".12"/></pattern>
 <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5cfcfa"/></marker>
 <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ad59e9"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/>
<circle cx="600" cy="330" r="170" fill="#2169af" opacity=".35" filter="url(#soft)"/>
<circle cx="250" cy="450" r="160" fill="#8565e4" opacity=".3" filter="url(#soft)"/>
<g fill="none" stroke="#46b6e9" stroke-opacity=".3" stroke-width="1.5"><path d="M1200 140H1150L1120 110H1010"/><path d="M0 635H200L225 610H420"/></g>
<g fill="#5cfcfa" opacity=".6"><circle cx="1010" cy="110" r="3"/><circle cx="420" cy="610" r="3"/></g>
<text class="m" x="60" y="72" fill="#5cfcfa" font-size="20" font-weight="700" letter-spacing="2" filter="url(#glow)">CRYPTO #HACK AUTOPSY · DAILY THREAD</text>
<text class="t" x="60" y="122" fill="#eaf6ff" font-size="44" font-weight="800">The DAO paid before updating its books</text>
<rect x="60" y="170" width="360" height="300" rx="12" fill="url(#glass)" stroke="#2169af" stroke-width="1.5"/>
<text class="m" x="84" y="205" font-size="15" font-weight="700" fill="#488fdb" text-anchor="start" letter-spacing="2">THE DAO CONTRACT</text>
<rect x="84" y="225" width="312" height="60" rx="10" fill="#081039" stroke="#2169af"/>
<text class="m" x="104" y="262" font-size="18" font-weight="700" fill="#d6e8ff" text-anchor="start">1. send ETH to caller</text>
<rect x="84" y="300" width="312" height="60" rx="10" fill="#081039" stroke="#ad59e9"/>
<text class="m" x="104" y="337" font-size="18" font-weight="700" fill="#ad59e9" text-anchor="start">2. update the balance</text>
<text class="" x="84" y="400" font-size="18" font-weight="500" fill="#8fa8dd" text-anchor="start">Step 2 came too late:</text>
<text class="" x="84" y="428" font-size="18" font-weight="500" fill="#8fa8dd" text-anchor="start">the caller re-entered before it.</text>
<rect x="780" y="170" width="360" height="300" rx="12" fill="url(#glass)" stroke="#8565e4" stroke-width="1.5" stroke-dasharray="7 6"/>
<text class="m" x="804" y="205" font-size="15" font-weight="700" fill="#ad59e9" text-anchor="start" letter-spacing="2">ATTACKER CONTRACT</text>
<text class="" x="804" y="250" font-size="20" font-weight="600" fill="#eaf6ff" text-anchor="start">On receiving ETH, it calls</text>
<text class="" x="804" y="277" font-size="20" font-weight="600" fill="#eaf6ff" text-anchor="start">withdraw() again, and</text>
<text class="" x="804" y="304" font-size="20" font-weight="600" fill="#eaf6ff" text-anchor="start">again...</text>
<path d="M396,250 C560,250 600,250 770,250" fill="none" stroke="#5cfcfa" stroke-width="2.5" marker-end="url(#a)"/>
<text class="m" x="585" y="238" font-size="17" font-weight="700" fill="#5cfcfa" text-anchor="middle">ETH</text>
<path d="M780,360 C620,420 560,420 420,280" fill="none" stroke="#ad59e9" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#av)"/>
<text class="m" x="600" y="445" font-size="17" font-weight="700" fill="#ad59e9" text-anchor="middle">withdraw() again</text>
<rect x="60" y="500" width="1080" height="100" rx="12" fill="url(#glass)" stroke="#2169af" stroke-width="1.5"/>
<text class="m" x="84" y="535" font-size="15" font-weight="700" fill="#488fdb" text-anchor="start" letter-spacing="2">THE SAME THREAD COVERS</text>
<text class="" x="84" y="575" font-size="20" font-weight="600" fill="#eaf6ff" text-anchor="start">Ronin&#x27;s phished employee  ·  Wormhole&#x27;s missing check  ·  Bybit&#x27;s lying screen</text>
<text class="m" x="1140" y="640" fill="#488fdb" font-size="15" text-anchor="end">@xcryptokeys</text>
</svg></body></html>
